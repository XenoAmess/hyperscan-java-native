name: build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
jobs:
  build-native:
    name: Build native libs
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            platform: linux-x86_64-baseline
          - os: linux
            runner: ubuntu-24.04
            platform: linux-x86_64-avx2
          - os: linux
            runner: ubuntu-24.04
            platform: linux-x86_64
          - os: linux
            runner: ubuntu-24.04-arm
            platform: linux-arm64-baseline
          - os: linux
            runner: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows
            runner: windows-latest
            platform: windows-x86_64-baseline
          - os: windows
            runner: windows-latest
            platform: windows-x86_64
    env:
      DETECTED_PLATFORM: ${{ matrix.platform }}
      STAGING: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build native binaries in centos container
        if: matrix.os == 'linux'
        uses: docker://ghcr.io/xenoamess/centos7-toolchain:clang22-lto
        with:
          args: '"./build.sh"'

      - name: Set up Python
        if: matrix.os == 'windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install ragel (MSYS2)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          C:/msys64/usr/bin/bash.exe -lc "pacman -Sy --noconfirm mingw-w64-ucrt-x86_64-ragel"
      - name: Setup MSVC dev command prompt
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native binaries on Windows
        if: matrix.os == 'windows'
        shell: bash
        run: |
          export PATH="/c/msys64/ucrt64/bin:/c/msys64/usr/bin:$PATH"
          ./build-windows.sh
      - name: Verify ISA per variant
        if: matrix.os == 'linux' && runner.arch == 'X64' && startsWith(matrix.platform, 'linux-x86_64')
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.platform }}"
          NATIVE_DIR="target/native/com/gliwka/hyperscan/jni/${PLATFORM}"
          mapfile -t SO_FILES < <(find "$NATIVE_DIR" -maxdepth 1 -type f -name '*.so' -print)
          if [ "${#SO_FILES[@]}" -lt 2 ]; then
            echo "FAIL: expected native libraries in $NATIVE_DIR, found ${#SO_FILES[@]}"
            exit 1
          fi

          for SO in "${SO_FILES[@]}"; do
            echo "Inspecting $SO"
            DISASSEMBLY=$(mktemp)
            objdump -d "$SO" > "$DISASSEMBLY"
            case "$PLATFORM" in
              linux-x86_64-baseline)
                # VEX prefixes C4/C5 include AVX and BMI instructions; 62 is EVEX.
                if grep -Eq '^[[:space:]]*[0-9a-f]+:[[:space:]]+(c4|c5|62)([[:space:]]+[0-9a-f]{2})+[[:space:]]+[a-z]' "$DISASSEMBLY"; then
                  echo "FAIL: $SO contains VEX/EVEX instructions"
                  grep -nE '^[[:space:]]*[0-9a-f]+:[[:space:]]+(c4|c5|62)([[:space:]]+[0-9a-f]{2})+[[:space:]]+[a-z]' "$DISASSEMBLY" | head -10
                  exit 1
                fi
                ;;
              linux-x86_64-avx2)
                if grep -Eq '^[[:space:]]*[0-9a-f]+:[[:space:]]+62([[:space:]]+[0-9a-f]{2})+[[:space:]]+[a-z]' "$DISASSEMBLY"; then
                  echo "FAIL: $SO contains EVEX (AVX-512) instructions"
                  grep -nE '^[[:space:]]*[0-9a-f]+:[[:space:]]+62([[:space:]]+[0-9a-f]{2})+[[:space:]]+[a-z]' "$DISASSEMBLY" | head -10
                  exit 1
                fi
                ;;
            esac
            rm -f "$DISASSEMBLY"
          done

          CORE="$NATIVE_DIR/libhs.so"
          test -f "$CORE"
          CORE_DISASSEMBLY=$(mktemp)
          objdump -d "$CORE" > "$CORE_DISASSEMBLY"
          case "$PLATFORM" in
            linux-x86_64-avx2)
              grep -Eq '^[[:space:]]*[0-9a-f]+:[[:space:]]+(c4|c5)([[:space:]]+[0-9a-f]{2})+[[:space:]]+[a-z]' "$CORE_DISASSEMBLY" || {
                echo "FAIL: AVX2 tier contains no VEX instructions"
                exit 1
              }
              ;;
            linux-x86_64)
              grep -Eq '^[[:space:]]*[0-9a-f]+:[[:space:]]+62([[:space:]]+[0-9a-f]{2})+[[:space:]]+[a-z]' "$CORE_DISASSEMBLY" || {
                echo "FAIL: AVX-512 tier contains no EVEX instructions"
                exit 1
              }
              ;;
          esac
          rm -f "$CORE_DISASSEMBLY"
          echo "PASS: ISA check passed for $PLATFORM"
      - name: Verify ARM ISA per variant
        if: matrix.os == 'linux' && runner.arch == 'ARM64' && startsWith(matrix.platform, 'linux-arm64')
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.platform }}"
          NATIVE_DIR="target/native/com/gliwka/hyperscan/jni/${PLATFORM}"
          mapfile -t SO_FILES < <(find "$NATIVE_DIR" -maxdepth 1 -type f -name '*.so' -print)
          if [ "${#SO_FILES[@]}" -lt 2 ]; then
            echo "FAIL: expected native libraries in $NATIVE_DIR, found ${#SO_FILES[@]}"
            exit 1
          fi
          for SO in "${SO_FILES[@]}"; do
            DISASSEMBLY=$(mktemp)
            objdump -d "$SO" > "$DISASSEMBLY"
            if [ "$PLATFORM" = "linux-arm64-baseline" ] && grep -Eq '\bz[0-9]+\.[bhsd]\b' "$DISASSEMBLY"; then
              echo "FAIL: baseline $SO contains SVE register instructions"
              exit 1
            fi
            rm -f "$DISASSEMBLY"
          done
          if [ "$PLATFORM" = "linux-arm64" ]; then
            CORE_DISASSEMBLY=$(mktemp)
            objdump -d "$NATIVE_DIR/libhs.so" > "$CORE_DISASSEMBLY"
            grep -Eq '\bz[0-9]+\.[bhsd]\b' "$CORE_DISASSEMBLY" || {
              echo "FAIL: SVE2 tier contains no SVE register instructions"
              exit 1
            }
            rm -f "$CORE_DISASSEMBLY"
          fi
          echo "PASS: ISA check passed for $PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-result-${{ matrix.platform }}
          path: target/staging-deploy

  sanitizer:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build and test baseline with ${{ matrix.sanitizer }} sanitizer
        env:
          DETECTED_PLATFORM: linux-x86_64-baseline
          SANITIZER: ${{ matrix.sanitizer }}
        run: ./run-sanitizer.sh
      - name: Upload sanitizer and crash logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanitizer-logs-${{ matrix.sanitizer }}
          path: |
            target/sanitizer/
            target/surefire-reports/
            hs_err_pid*.log
          if-no-files-found: ignore
      - name: Fail on sanitizer or crash diagnostics
        if: always()
        run: bash .github/scripts/check-crash-logs.sh

  package-native:
    name: Package unified native jars
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: target/variant-staging
          merge-multiple: false
      - name: Merge variants into unified classifier jars
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          GROUP_DIR="${PWD}/target/staging-deploy/com/xenoamess/hyperscan/native/${VERSION}"
          mkdir -p "$GROUP_DIR"

          # Generate the public Java API from one canonical Vectorscan 5.4.12 build.
          # Windows uses Intel Hyperscan 5.4.2 and must never supply common classes.
          CANONICAL_GROUP_DIR="target/variant-staging/build-result-linux-x86_64/com/xenoamess/hyperscan/native/${VERSION}"
          MAIN_JAR="${CANONICAL_GROUP_DIR}/native-${VERSION}.jar"
          SOURCES_JAR="${CANONICAL_GROUP_DIR}/native-${VERSION}-sources.jar"
          JAVADOC_JAR="${CANONICAL_GROUP_DIR}/native-${VERSION}-javadoc.jar"
          POM="${CANONICAL_GROUP_DIR}/native-${VERSION}.pom"
          for F in "$MAIN_JAR" "$SOURCES_JAR" "$JAVADOC_JAR" "$POM"; do
            if [ -z "$F" ] || [ ! -f "$F" ]; then
              echo "ERROR: missing canonical common artifact: $F"
              exit 1
            fi
            cp "$F" "$GROUP_DIR/"
          done

          for PLATFORM in \
            linux-x86_64-baseline linux-x86_64-avx2 \
            linux-arm64-baseline linux-arm64; do
            CANDIDATE="target/variant-staging/build-result-${PLATFORM}/com/xenoamess/hyperscan/native/${VERSION}/native-${VERSION}.jar"
            if [ ! -f "$CANDIDATE" ]; then
              echo "ERROR: missing common artifact for API comparison: $CANDIDATE"
              exit 1
            fi
            if ! cmp \
              <(unzip -p "$MAIN_JAR" com/gliwka/hyperscan/jni/hyperscan.class) \
              <(unzip -p "$CANDIDATE" com/gliwka/hyperscan/jni/hyperscan.class); then
              echo "ERROR: generated Java API differs for $PLATFORM"
              exit 1
            fi
          done

          # Locate the three linux-x86_64 variant classifier jars.
          LINUX_BASELINE_JAR=$(find target/variant-staging -type f -name "native-${VERSION}-linux-x86_64-baseline.jar" | head -n1)
          LINUX_AVX2_JAR=$(find target/variant-staging -type f -name "native-${VERSION}-linux-x86_64-avx2.jar" | head -n1)
          LINUX_AVX512_JAR=$(find target/variant-staging -type f -name "native-${VERSION}-linux-x86_64.jar" | head -n1)
          for F in "$LINUX_BASELINE_JAR" "$LINUX_AVX2_JAR" "$LINUX_AVX512_JAR"; do
            if [ -z "$F" ] || [ ! -f "$F" ]; then
              echo "ERROR: missing linux-x86_64 variant classifier jar"
              exit 1
            fi
          done

          # Merge the three linux-x86_64 variant native directories into one linux-x86_64 classifier jar.
          MERGE_DIR=$(mktemp -d)
          echo "Merging linux-x86_64 AVX-512 base from $LINUX_AVX512_JAR"
          unzip -q -o "$LINUX_AVX512_JAR" -d "$MERGE_DIR"
          echo "Overlaying linux-x86_64 AVX2 from $LINUX_AVX2_JAR"
          unzip -q -o "$LINUX_AVX2_JAR" -d "$MERGE_DIR"
          echo "Overlaying linux-x86_64 baseline from $LINUX_BASELINE_JAR"
          unzip -q -o "$LINUX_BASELINE_JAR" -d "$MERGE_DIR"
          (cd "$MERGE_DIR" && zip -r "$GROUP_DIR/native-${VERSION}-linux-x86_64.jar" .)
          rm -rf "$MERGE_DIR"

          # Locate the two linux-arm64 variant classifier jars.
          ARM64_BASELINE_JAR=$(find target/variant-staging -type f -name "native-${VERSION}-linux-arm64-baseline.jar" | head -n1)
          ARM64_SVE2_JAR=$(find target/variant-staging -type f -name "native-${VERSION}-linux-arm64.jar" | head -n1)
          for F in "$ARM64_BASELINE_JAR" "$ARM64_SVE2_JAR"; do
            if [ -z "$F" ] || [ ! -f "$F" ]; then
              echo "ERROR: missing linux-arm64 variant classifier jar"
              exit 1
            fi
          done

          # Merge the two linux-arm64 variant native directories into one linux-arm64 classifier jar.
          MERGE_DIR=$(mktemp -d)
          echo "Merging linux-arm64 SVE2 base from $ARM64_SVE2_JAR"
          unzip -q -o "$ARM64_SVE2_JAR" -d "$MERGE_DIR"
          echo "Overlaying linux-arm64 baseline from $ARM64_BASELINE_JAR"
          unzip -q -o "$ARM64_BASELINE_JAR" -d "$MERGE_DIR"
          (cd "$MERGE_DIR" && zip -r "$GROUP_DIR/native-${VERSION}-linux-arm64.jar" .)
          rm -rf "$MERGE_DIR"

          # Locate the two windows-x86_64 variant classifier jars.
          WIN_BASELINE_JAR=$(find target/variant-staging -type f -name "native-${VERSION}-windows-x86_64-baseline.jar" | head -n1)
          WIN_AVX2_JAR=$(find target/variant-staging -type f -name "native-${VERSION}-windows-x86_64.jar" | head -n1)
          for F in "$WIN_BASELINE_JAR" "$WIN_AVX2_JAR"; do
            if [ -z "$F" ] || [ ! -f "$F" ]; then
              echo "ERROR: missing windows-x86_64 variant classifier jar"
              exit 1
            fi
          done

          # Merge the two windows-x86_64 variant native directories into one windows-x86_64 classifier jar.
          MERGE_DIR=$(mktemp -d)
          echo "Merging windows-x86_64 AVX2 base from $WIN_AVX2_JAR"
          unzip -q -o "$WIN_AVX2_JAR" -d "$MERGE_DIR"
          echo "Overlaying windows-x86_64 baseline from $WIN_BASELINE_JAR"
          unzip -q -o "$WIN_BASELINE_JAR" -d "$MERGE_DIR"
          (cd "$MERGE_DIR" && zip -r "$GROUP_DIR/native-${VERSION}-windows-x86_64.jar" .)
          rm -rf "$MERGE_DIR"

          # Recreate maven metadata for the local staging repository.
          mkdir -p "target/staging-deploy/com/xenoamess/hyperscan/native"
          echo "Staging repository prepared at target/staging-deploy"
          find target/staging-deploy -type f
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-result-native-merged
          path: target/staging-deploy

  test-linux-x86_64:
    name: Test linux-x86_64 variants
    needs: package-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-result-native-merged
          path: target/staging-deploy
      - name: Build test classpath
        run: mvn -B dependency:build-classpath -Dmdep.outputFile=target/cp.txt -DincludeScope=test
      - name: Prepare classes and run end-to-end tests
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          MAIN_JAR="target/staging-deploy/com/xenoamess/hyperscan/native/${VERSION}/native-${VERSION}.jar"
          CLASSIFIER_JAR="target/staging-deploy/com/xenoamess/hyperscan/native/${VERSION}/native-${VERSION}-linux-x86_64.jar"

          if [ ! -f "$MAIN_JAR" ] || [ ! -f "$CLASSIFIER_JAR" ]; then
            echo "ERROR: missing artifact jar"
            exit 1
          fi

          mkdir -p target/classes target/test-classes target/native-test
          unzip -q -o "$MAIN_JAR" -d target/classes
          unzip -q -o "$CLASSIFIER_JAR" -d target/native-test

          javac -cp "target/classes:$(cat target/cp.txt)" -d target/test-classes \
            src/test/java/com/gliwka/hyperscan/jni/EndToEndTest.java \
            src/test/java/com/gliwka/hyperscan/jni/LoaderFirstUseProbe.java

          CP="target/classes:target/test-classes:target/native-test:$(cat target/cp.txt)"

          echo "=== default platform ==="
          java -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest

          echo "=== forced linux-x86_64-baseline ==="
          java -Dorg.bytedeco.javacpp.platform=linux-x86_64-baseline -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest

          for FIRST_CLASS in \
            com.gliwka.hyperscan.jni.hs_compile_error_t \
            com.gliwka.hyperscan.jni.match_event_handler; do
            java -cp "$CP" com.gliwka.hyperscan.jni.LoaderFirstUseProbe \
              linux-x86_64-baseline "$FIRST_CLASS"
          done

          CPU_FLAGS=$(grep -m1 '^flags' /proc/cpuinfo || true)
          REQUIRED_AVX2_FLAGS="sse4_2 popcnt avx avx2 bmi1 bmi2 f16c fma movbe xsave"
          MISSING_AVX2=""
          for FLAG in $REQUIRED_AVX2_FLAGS; do
            if ! grep -qw "$FLAG" <<< "$CPU_FLAGS"; then
              MISSING_AVX2="$MISSING_AVX2 $FLAG"
            fi
          done
          if ! grep -Eqw '(abm|lzcnt)' <<< "$CPU_FLAGS"; then
            MISSING_AVX2="$MISSING_AVX2 lzcnt"
          fi
          if [ -z "$MISSING_AVX2" ]; then
            echo "=== forced linux-x86_64-avx2 ==="
            java -Dorg.bytedeco.javacpp.platform=linux-x86_64-avx2 -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest
            for FIRST_CLASS in \
              com.gliwka.hyperscan.jni.hs_compile_error_t \
              com.gliwka.hyperscan.jni.match_event_handler; do
              java -cp "$CP" com.gliwka.hyperscan.jni.LoaderFirstUseProbe \
                linux-x86_64-avx2 "$FIRST_CLASS"
            done
          else
            echo "::warning::Skipping AVX2 runtime test; missing:$MISSING_AVX2"
          fi

          REQUIRED_AVX512_FLAGS="$REQUIRED_AVX2_FLAGS avx512f avx512cd avx512dq avx512bw avx512vl avx512vbmi avx512_bitalg avx512_vpopcntdq"
          MISSING_AVX512=""
          for FLAG in $REQUIRED_AVX512_FLAGS; do
            if ! grep -qw "$FLAG" <<< "$CPU_FLAGS"; then
              MISSING_AVX512="$MISSING_AVX512 $FLAG"
            fi
          done
          if ! grep -Eqw '(abm|lzcnt)' <<< "$CPU_FLAGS"; then
            MISSING_AVX512="$MISSING_AVX512 lzcnt"
          fi
          if [ -z "$MISSING_AVX512" ]; then
            echo "=== forced linux-x86_64 AVX-512 ==="
            java -Dorg.bytedeco.javacpp.platform=linux-x86_64 -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest
            java -cp "$CP" com.gliwka.hyperscan.jni.LoaderFirstUseProbe \
              linux-x86_64 com.gliwka.hyperscan.jni.hs_compile_error_t
          else
            echo "::warning::Skipping AVX-512 runtime test; missing:$MISSING_AVX512"
          fi
      - name: Upload crash logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crash-logs-linux-x86_64
          path: |
            hs_err_pid*.log
            target/surefire-reports/*.dump
            target/surefire-reports/*.dumpstream
          if-no-files-found: ignore
      - name: Fail on native or JVM crash diagnostics
        if: always()
        run: bash .github/scripts/check-crash-logs.sh

  test-linux-arm64:
    name: Test linux-arm64 variants
    needs: package-native
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-result-native-merged
          path: target/staging-deploy
      - name: Build test classpath
        run: mvn -B dependency:build-classpath -Dmdep.outputFile=target/cp.txt -DincludeScope=test
      - name: Prepare classes and run end-to-end tests
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          MAIN_JAR="target/staging-deploy/com/xenoamess/hyperscan/native/${VERSION}/native-${VERSION}.jar"
          CLASSIFIER_JAR="target/staging-deploy/com/xenoamess/hyperscan/native/${VERSION}/native-${VERSION}-linux-arm64.jar"

          if [ ! -f "$MAIN_JAR" ] || [ ! -f "$CLASSIFIER_JAR" ]; then
            echo "ERROR: missing artifact jar"
            exit 1
          fi

          mkdir -p target/classes target/test-classes target/native-test
          unzip -q -o "$MAIN_JAR" -d target/classes
          unzip -q -o "$CLASSIFIER_JAR" -d target/native-test

          javac -cp "target/classes:$(cat target/cp.txt)" -d target/test-classes \
            src/test/java/com/gliwka/hyperscan/jni/EndToEndTest.java \
            src/test/java/com/gliwka/hyperscan/jni/LoaderFirstUseProbe.java

          CP="target/classes:target/test-classes:target/native-test:$(cat target/cp.txt)"

          echo "=== default arm64 platform ==="
          java -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest

          echo "=== forced linux-arm64-baseline ==="
          java -Dorg.bytedeco.javacpp.platform=linux-arm64-baseline -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest

          java -cp "$CP" com.gliwka.hyperscan.jni.LoaderFirstUseProbe \
            linux-arm64-baseline com.gliwka.hyperscan.jni.hs_compile_error_t

          if grep -m1 '^Features' /proc/cpuinfo | grep -qw 'sve2'; then
            echo "=== forced linux-arm64 SVE2 ==="
            java -Dorg.bytedeco.javacpp.platform=linux-arm64 -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest
            java -cp "$CP" com.gliwka.hyperscan.jni.LoaderFirstUseProbe \
              linux-arm64 com.gliwka.hyperscan.jni.hs_compile_error_t
          else
            echo "::warning::Skipping SVE2 runtime test; CPU does not expose sve2"
          fi
      - name: Upload crash logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crash-logs-linux-arm64
          path: |
            hs_err_pid*.log
            target/surefire-reports/*.dump
            target/surefire-reports/*.dumpstream
          if-no-files-found: ignore
      - name: Fail on native or JVM crash diagnostics
        if: always()
        run: bash .github/scripts/check-crash-logs.sh

  test-windows-x86_64:
    name: Test windows-x86_64 variants
    needs: package-native
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-result-native-merged
          path: target/staging-deploy
      - name: Build test classpath
        shell: bash
        run: mvn -B dependency:build-classpath -Dmdep.outputFile=target/cp.txt -DincludeScope=test -Dmdep.pathSeparator=';'
      - name: Prepare classes and run end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          MAIN_JAR="target/staging-deploy/com/xenoamess/hyperscan/native/${VERSION}/native-${VERSION}.jar"
          CLASSIFIER_JAR="target/staging-deploy/com/xenoamess/hyperscan/native/${VERSION}/native-${VERSION}-windows-x86_64.jar"

          if [ ! -f "$MAIN_JAR" ] || [ ! -f "$CLASSIFIER_JAR" ]; then
            echo "ERROR: missing artifact jar"
            exit 1
          fi

          mkdir -p target/classes target/test-classes target/native-test
          unzip -q -o "$MAIN_JAR" -d target/classes
          unzip -q -o "$CLASSIFIER_JAR" -d target/native-test

          javac -cp "target/classes;$(cat target/cp.txt)" -d target/test-classes \
            src/test/java/com/gliwka/hyperscan/jni/EndToEndTest.java \
            src/test/java/com/gliwka/hyperscan/jni/LoaderFirstUseProbe.java \
            src/test/java/com/gliwka/hyperscan/jni/WindowsPlatformSelectionProbe.java

          CP="target/classes;target/test-classes;target/native-test;$(cat target/cp.txt)"

          echo "=== default platform ==="
          java -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest

          echo "=== forced windows-x86_64-baseline ==="
          java -Dorg.bytedeco.javacpp.platform=windows-x86_64-baseline -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest

          java -cp "$CP" com.gliwka.hyperscan.jni.LoaderFirstUseProbe \
            windows-x86_64-baseline com.gliwka.hyperscan.jni.hs_compile_error_t

          echo "=== selection with AVX2 disabled in the VM ==="
          java -XX:UseAVX=1 -cp "$CP" com.gliwka.hyperscan.jni.WindowsPlatformSelectionProbe \
            windows-x86_64-baseline

          SELECTED=$(java -cp "$CP" com.gliwka.hyperscan.jni.WindowsPlatformSelectionProbe)
          if [ "$SELECTED" = "windows-x86_64" ]; then
            echo "=== forced windows-x86_64 AVX2 ==="
            java -Dorg.bytedeco.javacpp.platform=windows-x86_64 -cp "$CP" com.gliwka.hyperscan.jni.EndToEndTest
            java -cp "$CP" com.gliwka.hyperscan.jni.LoaderFirstUseProbe \
              windows-x86_64 com.gliwka.hyperscan.jni.hs_compile_error_t
          else
            echo "::warning::Skipping Windows AVX2 runtime test; selected $SELECTED"
          fi
      - name: Upload crash logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crash-logs-windows-x86_64
          path: |
            hs_err_pid*.log
            target/surefire-reports/*.dump
            target/surefire-reports/*.dumpstream
          if-no-files-found: ignore
      - name: Fail on native or JVM crash diagnostics
        if: always()
        run: bash .github/scripts/check-crash-logs.sh

  publish:
    if: contains(github.ref, 'refs/tags/v')
    needs:
      - package-native
      - test-linux-x86_64
      - test-linux-arm64
      - test-windows-x86_64
      - sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-result-native-merged
          path: target/staging-deploy
      - name: Merge multiple local repositories
        run: ./merge-artifacts.sh
      - uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5
        with:
          arguments: deploy --debug
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGN_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGN_KEY_PASS }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: releaser
          path: |
            target/staging-deploy
            out
